[project]
name = "agents"
version = "0.1.0"
description = "Agents framework for building AI agents with tool usage and memory."
readme = "README.md"
authors = [
    { name = "Harry Xiong", email = "harryxiong24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite",
    "deepagents>=0.7.28",
    "gradio>=6.0",
    "grandalf>=0.8",
    "httpx",
    "ipython>=9.17.1",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.2",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint>=4.2.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "mcp>=1.10",
    "openai>=3.3.0",
    "openai-agents>=0.23.1",
    "pydantic>=2.12.5",
    "pypdf>=6.0",
    "python-dotenv>=1.0",
    "python-pptx>=1.0.2",
    "requests>=2.34.2",
]

[project.scripts]
# One entry per runnable agent. Each points at its app.py rather than at the
# package itself: the __init__.py files deliberately do not import the UI, so
# that importing ChatAgent does not pull in gradio.
resume-digging-agent = "agent_apps.resume_digging_agent.__main__:main"
deep-research-agent = "agent_apps.deep_research_agent.__main__:main"
agent-by-langgraph = "agent_apps.agent_by_langgraph.__main__:main"
react-agent = "agent_apps.react_agent.__main__:main"
simple-react-agent = "agent_apps.simple_react_agent.main:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_apps"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
